# AtlasLLM-Base-v2 - Capacity step: 13M -> 48M params
# Evidence (sampling sweep + scorecard, AtlasBase-v1): repetition is a
# temperature artifact with no sweet spot; derailment (invented words, topic
# drift) is model capacity. This run attacks capacity directly, reusing the
# AtlasBase-v1 corpus (same 186M tokens, ~1 epoch, same 16k tokenizer) so the
# only change vs v1 is the model size. If val loss stalls under the capacity
# step, the follow-on (A) is more data/epochs.
# Target: GTX 1070 8GB VRAM

pipeline:
  dataset:
    name: "AtlasBase-v2"
    version: 2
  paths:
    raw: "data/raw"
    interim: "data/interim"
    reports: "reports/data"

model:
  vocab_size: 16000
  context_length: 256
  d_model: 512
  n_layers: 10
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  bias: false

tokenizer:
  # Reuse the AtlasBase-v1 tokenizer (same domains/source); BPE is corpus-level,
  # not model-size dependent.
  vocab_size: 16000

training:
  batch_size: 8
  learning_rate: 2.0e-4
  weight_decay: 0.1
  max_steps: 95000
  warmup_steps: 1000
  grad_clip: 1.0
  seed: 42

data:
  train_path: "data/processed/atlasbase/train.bin"
  val_path: "data/processed/atlasbase/val.bin"
  test_path: "data/processed/atlasbase/test.bin"
  tokenizer_path: "tokenizer/model/atlasbase"

checkpoint:
  dir: "checkpoints/atlasbase_v2"
  save_every: 1000

logging:
  log_every: 100
  val_every: 2000
  max_val_batches: 200
  tensorboard: true

device: "auto"
dtype: "float32"