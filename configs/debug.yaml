# AtlasLLM-Debug — Minimal config for quick verification
# Use for: overfit test, shape checks, gradient flow tests

model:
  vocab_size: 1280
  context_length: 32
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 128
  dropout: 0.0
  bias: false

tokenizer:
  vocab_size: 1280
  min_frequency: 2
  corpus_path: "data/interim/wikitext-2-raw/corpus.txt"

training:
  batch_size: 2
  learning_rate: 1.0e-3
  weight_decay: 0.0
  max_steps: 100
  warmup_steps: 10
  grad_clip: 1.0
  seed: 42

data:
  train_path: "data/processed/debug/train.bin"
  val_path: "data/processed/debug/val.bin"
  test_path: "data/processed/debug/test.bin"
  tokenizer_path: "tokenizer/model/debug"
  train_text: "data/raw/wikitext-2-raw/train.txt"
  val_text: "data/raw/wikitext-2-raw/valid.txt"
  test_text: "data/raw/wikitext-2-raw/test.txt"

checkpoint:
  dir: "checkpoints/debug"
  save_every: 50

logging:
  log_every: 10
  val_every: 25

device: "auto"
dtype: "float32"
