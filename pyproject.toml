[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-llm"
version = "0.1.0"
description = "A small dense decoder-only Transformer language model built from scratch for learning."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tokenization = [
    "tokenizers>=0.19",
]
data = [
    "datasets>=2.14",
    "pandas>=2.0",
]
tracking = [
    "tensorboard>=2.14",
]
visualization = [
    "matplotlib>=3.7",
]
testing = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
quality = [
    "ruff>=0.4",
]
all = [
    "atlas-llm[tokenization,data,tracking,visualization,testing,quality]",
]

[tool.setuptools.packages.find]
include = ["model*", "tokenizer*", "data_pipeline*", "training*", "inference*", "evaluation*", "safety*", "harness*", "monitoring*", "scripts*"]
exclude = ["tests*", "configs*", "data*", "DOCUMENTATION*", "checkpoints*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
